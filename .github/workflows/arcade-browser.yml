name: Arcade Browser QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arcade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare browser checks
        run: |
          python -m pip install selenium==4.37.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-wqy-microhei
      - name: Compile scheduled real-game Chromium QA script
        run: python -m py_compile tests/live_games.browser.py
      - name: Test real arcade filtering and mobile experience
        run: python tests/arcade.browser.py
      - name: Test real 1,000+ GitHub project galaxy and selection restrictions
        run: python tests/universe.browser.py
      - name: Test seven local developer tools with real desktop/mobile Chromium interaction
        run: python tests/utilities.browser.py
      - name: Test real public GitHub REST API requests, comparisons and mobile inspector
        run: python tests/api-lab.browser.py
      - name: Test real portfolio mission control, release evidence, and responsive operations
        run: python tests/mission.browser.py
      - name: Test real multi-domain delivery evidence, filters and workboard interaction
        run: python tests/release-review.browser.py
      - name: Test actual blueprint execution, dependency blocking, re-import and mobile recovery
        run: python tests/blueprint-execution.browser.py
      - name: Preserve arcade screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-game-arcade-qa
          path: |
            test-artifacts/arcade/
            test-artifacts/universe/
            test-artifacts/mission/
            test-artifacts/utilities/
            test-artifacts/api-lab/
            test-artifacts/release-review/
            test-artifacts/blueprint-execution/
          if-no-files-found: ignore
