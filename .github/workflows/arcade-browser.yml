name: Arcade Browser QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arcade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare browser checks
        run: |
          python -m pip install selenium==4.37.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-wqy-microhei
      - name: Test real arcade filtering and mobile experience
        run: python tests/arcade.browser.py
      - name: Test real 1,000+ GitHub project galaxy and selection restrictions
        run: python tests/universe.browser.py
      - name: Preserve arcade screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-game-arcade-qa
          path: |
            test-artifacts/arcade/
            test-artifacts/universe/
          if-no-files-found: ignore
