name: ATLAS · Validate and Publish
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '13 * * * *'
permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write
concurrency:
  group: atlas-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: npm test
      - name: Real game QA evidence module syntax
        run: node --check game-runtime-core.js && node --check game-runtime-ui.js
      - name: Module syntax
        run: node --check app.js && node --check status.js && node --check deploy-core.js && node --check site-probe-core.js && node --check scripts/build-status.mjs && node --check scripts/asset-version.mjs
      - name: Build public status snapshot
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Verify deployment artifacts and browser import graph
        run: |
          test -s dist/index.html
          test -s dist/arcade.js
          test -s dist/data/status.json
          node --check scripts/verify-dist.mjs
          node scripts/verify-dist.mjs
          node --input-type=module -e "import fs from 'node:fs'; const d=JSON.parse(fs.readFileSync('dist/data/status.json','utf8')); if(!d.publicOnly || !Array.isArray(d.projects))process.exit(1);"
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-site-${{ github.run_id }}
          path: dist
          retention-days: 3
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: atlas-site-${{ github.run_id }}
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4