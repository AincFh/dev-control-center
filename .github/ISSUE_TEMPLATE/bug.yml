name: "缺陷报告 / Bug"
description: "报告可复现的故障"
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: "1. 打开……\n2. 点击……\n3. 出现……"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望表现
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际表现
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图、浏览器控制台、Actions 运行地址
  - type: input
    id: environment
    attributes:
      label: 浏览器、设备与版本
